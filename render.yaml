services:
  - type: web
    name: membu
    runtime: python
    plan: starter
    healthCheckPath: /health

    buildCommand: pip install -r requirements.txt
    startCommand: python main.py

    envVars:
      - key: TOKEN
        sync: false

      - key: GEMINI_API_KEY
        sync: false

      - key: GEMINI_BACKUP_API_KEY
        sync: false

      - key: GEMINI_BACKUP2_API_KEY
        sync: false

      - key: GEMINI_BACKUP3_API_KEY
        sync: false

      - key: FISH_API_KEY
        sync: false

      - key: FISH_VOICE_ID
        sync: false

      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false

      - key: CLOUDFLARE_API_TOKEN
        sync: false

      - key: CF_IMAGE_MODEL
        value: "@cf/black-forest-labs/flux-1-schnell"

      - key: MEMBU_IMAGE_DAILY_LIMIT
        value: "35"

      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite

      - key: SUPABASE_URL
        sync: false

      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      - key: MEMBU_DEBOUNCE_SECONDS
        value: "3"

      - key: MEMBU_BRANCH_TTL_SECONDS
        value: "300"
