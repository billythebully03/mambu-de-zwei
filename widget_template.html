<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{margin:0;box-sizing:border-box}
html,body{height:100%;background:#6A2FE7;overflow:hidden;font-family:system-ui,sans-serif;color:#fff}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px}
.sq{position:relative;width:240px;height:240px;border-radius:28px;overflow:hidden;animation:reveal .56s cubic-bezier(.2,.75,.25,1) both;transition:filter .7s ease,opacity .7s ease}
.base{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(9px);transform:scale(1.08)}
.lens{position:absolute;left:0;top:0;width:120px;height:120px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px rgba(255,255,255,.55),0 0 18px rgba(255,255,255,.35)}
.sharp{position:absolute;left:0;top:0;width:240px;height:240px;object-fit:cover}
@keyframes reveal{0%{opacity:0;filter:blur(14px)}65%{opacity:1;filter:blur(1.5px)}100%{opacity:1;filter:blur(0)}}
.caption{min-height:24px;max-width:92vw;font-size:17px;text-align:center;transition:filter .35s ease,opacity .35s ease}
.caption span{display:inline-block;white-space:pre;animation:in .26s ease both;animation-delay:var(--d)}
@keyframes in{from{opacity:0;filter:blur(6px)}to{opacity:1;filter:blur(0)}}
.done .sq{filter:blur(20px);opacity:0}
.done .caption{filter:blur(12px);opacity:0}
@media (prefers-reduced-motion:reduce){.sq,.caption span{animation:none}}
</style></head><body>
<div class="sq" id="sq">
<img class="base" src="__IMG__" alt="">
<div class="lens" id="lens"><img class="sharp" id="sharp" src="__IMG__" alt=""></div>
</div>
<div class="caption" id="c" aria-live="polite"></div>
<script>
(()=>{
const P=['Листаю память','Подбираю краски','Смешиваю цвета','Ставлю свет, тень туда','Так, это уже интереснее','Добавляю деталей','Переделаю, если криво','Почти готово, не торопи','Что-то я перестарался','Ну и кто тут художник?'];
const E=['Ладно, я доволен','Ну, красота же','Несу показывать'];
const cap=document.getElementById('c');
const lens=document.getElementById('lens');
const sharp=document.getElementById('sharp');
const MAX=120;
let last=-1,phraseT=0,lensT=0,cx=40,cy=40,stopped=false;
function show(t){cap.replaceChildren(...[...t].map((ch,i)=>{const s=document.createElement('span');s.textContent=ch===' '?' ':ch;s.style.setProperty('--d',i*18+'ms');return s}))}
function next(){if(stopped)return;let i;do{i=Math.random()*P.length|0}while(i===last);last=i;show(P[i]+'....');phraseT=setTimeout(next,1800+Math.random()*1000)}
function drift(){if(stopped)return;const tx=Math.random()*MAX,ty=Math.random()*MAX,d=1800+Math.random()*1400;
lens.animate([{transform:`translate(${cx}px,${cy}px)`},{transform:`translate(${tx}px,${ty}px)`}],{duration:d,easing:'ease-in-out',fill:'forwards'});
sharp.animate([{transform:`translate(${-cx}px,${-cy}px)`},{transform:`translate(${-tx}px,${-ty}px)`}],{duration:d,easing:'ease-in-out',fill:'forwards'});
cx=tx;cy=ty;lensT=setTimeout(drift,d+150)}
function finish(){if(stopped)return;stopped=true;clearTimeout(phraseT);clearTimeout(lensT);show(E[Math.random()*E.length|0]);setTimeout(()=>document.body.classList.add('done'),900)}
function state(){try{const d=window.TelegramWidget&&TelegramWidget.chatData;return d?JSON.parse(d):{}}catch(e){return{}}}
function check(){if(state().s==='done')finish()}
if(state().s==='done'){stopped=true;document.body.classList.add('done')}else{next();drift()}
if(window.TelegramWidget)TelegramWidget.onEvent('chatDataChanged',check);
})();
</script></body></html>
